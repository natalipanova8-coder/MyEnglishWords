plugins { id 'com.android.application' }
android { namespace 'com.myenglishwords.app'; compileSdk 35
 defaultConfig { applicationId 'com.myenglishwords.app'; minSdk 26; targetSdk 35; versionCode 2; versionName '2.0' } }

// On-device text recognition and on-demand English → Ukrainian translation
dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-cyrillic:16.0.1'
    implementation 'com.google.mlkit:translate:17.0.3'
}
