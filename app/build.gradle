plugins { id 'com.android.application' }
android { namespace 'com.myenglishwords.app'; compileSdk 35
 defaultConfig { applicationId 'com.myenglishwords.app'; minSdk 26; targetSdk 35; versionCode 4; versionName '3.0-ocr-test' } }

// On-device text recognition and on-demand English → Ukrainian translation
dependencies {
    implementation 'com.rmtheis:tess-two:9.1.0'
   
    implementation 'com.google.mlkit:translate:17.0.3'
}
