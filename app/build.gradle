plugins { id 'com.android.application' }
android { namespace 'com.myenglishwords.app'; compileSdk 35
 defaultConfig { applicationId 'com.myenglishwords.app'; minSdk 26; targetSdk 35; versionCode 5; versionName '3.0-ocr-fix2' } }

// On-device text recognition and on-demand English → Ukrainian translation
dependencies {
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.8.0'
   
    implementation 'com.google.mlkit:translate:17.0.3'
}
